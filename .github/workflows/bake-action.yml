name: CI/CD Pipeline - Bake Action

on:
  push:
    branches: [ "Test", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Configurar Node.js basado en los requisitos del proyecto
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      # 2. Habilitar Corepack para usar la versión correcta de Yarn
      - name: Habilitar Yarn
        run: corepack enable

      # 3. Instalar dependencias con Yarn
      - name: Instalar dependencias
        run: yarn install 

      # 4. Verificar el código (Lint y Pruebas)
      - name: Verificar código (Lint)
        run: yarn run lint


      # 5. Compilar el código
      - name: Compilar TypeScript
        run: yarn run build

      # 6. Iniciar sesión en GitHub Container Registry
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Extraer metadatos para la imagen Docker
      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # 8. Construir y subir la imagen Docker usando dev.Dockerfile
      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dev.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}